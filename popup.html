<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Buddy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="header">
    <span class="header-title">🎉 Birthday Buddy</span>
    <button id="settingsBtn" class="icon-btn" title="Open Settings">⚙️</button>
  </div>

  <!-- View toggle (hidden when composer is open) -->
  <div class="view-toggle" id="viewToggle">
    <button id="btnViewToday" class="view-btn active">
      Birthdays <span id="todayBadge" class="today-badge" style="display:none"></span>
    </button>
    <button id="btnViewAll" class="view-btn">All Contacts</button>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       PANEL A: Birthday scroll  (hidden when composer open)
  ═══════════════════════════════════════════════════════ -->
  <div id="birthdayPanel">

    <!-- Infinite scroll -->
    <div id="dayScroll">
      <div id="topSentinel"></div>
      <!-- day sections injected by JS -->
      <div id="bottomSentinel"></div>
    </div>

    <!-- All Contacts view (swaps with dayScroll) -->
    <div id="allContactsPanel" style="display:none">
      <div class="all-contacts-inner">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by name…" />
        <div id="allContactsList"></div>
        <div id="noContacts" class="empty-state" style="display:none">
          No contacts yet — import a CSV or add one in Settings.
        </div>
      </div>
    </div>

  </div><!-- /birthdayPanel -->


  <!-- ═══════════════════════════════════════════════════════
       PANEL B: Message composer  (replaces birthday panel)
  ═══════════════════════════════════════════════════════ -->
  <div id="composerPanel" style="display:none">

    <div class="composer-topbar">
      <button id="backBtn" class="back-btn">← Back</button>
      <div class="composer-who">🎉 <strong id="composerName"></strong>'s Birthday</div>
    </div>

    <div class="composer-body">

      <!-- ── AI section (shown when API key is set) ── -->
      <div id="aiSection" style="display:none">

        <div id="aiSpinner" class="ai-spinner" style="display:none">
          <span class="spinner"></span>
          <span>Generating message in Afrikaans…</span>
        </div>

        <div id="aiMessageWrap" style="display:none">
          <label class="field-label">Your message <span class="field-hint">(edit freely before copying)</span></label>
          <textarea id="aiMessage" class="ai-textarea" rows="5"></textarea>
        </div>

        <div id="aiError" class="ai-error" style="display:none"></div>

        <div class="action-row">
          <button id="regenBtn" class="btn btn-ghost">↻ Regenerate</button>
          <button id="copyAiBtn" class="btn btn-primary">📋 Copy &amp; Save</button>
        </div>

        <div class="tone-note" id="toneNote"></div>
      </div>

      <!-- ── Template fallback (no API key) ── -->
      <div id="templateSection" style="display:none">
        <div class="no-api-banner">
          💡 Add an API key in
          <button id="goToApiKey" class="inline-link">Settings → 🔑 API Key</button>
          to get AI-generated messages.
        </div>
        <div class="field-row">
          <label class="field-label">Language</label>
          <select id="msgLang" class="field-select">
            <option value="english">🇬🇧 English</option>
            <option value="afrikaans">🇿🇦 Afrikaans</option>
          </select>
        </div>
        <div class="msg-list" id="msgList"></div>
        <div id="msgPreview" class="msg-preview"></div>
        <button id="copyTplBtn" class="btn btn-primary" style="width:100%">📋 Copy Message</button>
      </div>

    </div><!-- /composer-body -->

    <div id="copyFeedback" class="copy-feedback" style="display:none">
      ✅ Copied! Open WhatsApp and paste.
    </div>

  </div><!-- /composerPanel -->


  <div class="footer">
    <button id="manageBtn" class="footer-link">⚙️ Manage Birthdays &amp; Messages</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
