<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Buddy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="header">
    <span class="header-title">🎂 Birthday Buddy</span>
    <button id="settingsBtn" class="icon-btn" title="Open Settings">⚙️</button>
  </div>

  <!-- View toggle -->
  <div class="view-toggle">
    <button id="btnViewToday" class="view-btn active">
      Birthdays <span id="todayBadge" class="today-badge" style="display:none"></span>
    </button>
    <button id="btnViewAll" class="view-btn">All Contacts</button>
  </div>

  <!-- ── VIEW: Birthdays (infinite scroll) ── -->
  <div id="viewToday">
    <div id="dayScroll">
      <div id="topSentinel"></div>
      <!-- day sections injected here by JS -->
      <div id="bottomSentinel"></div>
    </div>

    <!-- Message Composer (appears below scroll, starred contacts today only) -->
    <div id="composer" class="composer" style="display:none">
      <div class="composer-header">
        <span class="composer-title">🎉 Birthday Message</span>
        <div class="composer-meta">for <strong id="composerName"></strong></div>
        <button id="closeComposer" class="close-btn" title="Close">✕</button>
      </div>

      <!-- AI section (shown when API key is set) -->
      <div id="aiSection" style="display:none">
        <div id="aiSpinner" class="ai-spinner" style="display:none">
          <span class="spinner"></span> Generating in Afrikaans…
        </div>
        <textarea id="aiMessage" class="ai-textarea" rows="4"
          placeholder="Your AI-generated message will appear here…"></textarea>
        <div id="aiError" class="ai-error" style="display:none"></div>
        <div class="ai-hint">✏️ Edit the message above to your liking before copying.</div>
        <div class="btn-row">
          <button id="regenBtn" class="btn btn-regen">↻ Regenerate</button>
          <button id="copyAiBtn" class="btn btn-copy">📋 Copy &amp; Save</button>
        </div>
      </div>

      <!-- Template fallback (shown when no API key) -->
      <div id="templateSection" style="display:none">
        <div class="no-api-hint">
          💡 <button id="goToApiKey" class="inline-link">Add an API key in Settings</button>
          to get AI-generated messages.
        </div>
        <div class="composer-row">
          <label>Language</label>
          <select id="msgLang">
            <option value="english">🇬🇧 English</option>
            <option value="afrikaans">🇿🇦 Afrikaans</option>
          </select>
        </div>
        <div class="msg-list" id="msgList"></div>
        <div id="msgPreview" class="msg-preview"></div>
        <button id="copyTplBtn" class="btn btn-copy">📋 Copy Message</button>
      </div>

      <div id="copyFeedback" class="copy-feedback" style="display:none">
        ✅ Copied! Paste it into WhatsApp.
      </div>
    </div>
  </div>

  <!-- ── VIEW: All Contacts ── -->
  <div id="viewAll" style="display:none">
    <div class="all-contacts-section">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by name…" />
      <div id="allContactsList"></div>
      <div id="noContacts" class="empty-state" style="display:none">
        No contacts yet. Go to Settings to import or add some.
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="manageBtn" class="footer-link">⚙️ Manage Birthdays &amp; Messages</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
